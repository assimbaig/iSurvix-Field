worker_processes 1;
pid logs/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    default_type application/octet-stream;
    server_tokens off;
    log_format private_edge '$time_iso8601 $status $request_method $request_time';
    access_log /dev/stdout private_edge;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8080;
        server_name app.isurvix.com;
        if ($host != "app.isurvix.com") { return 444; }
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            autoindex off;
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / {
            return 308 https://app.isurvix.com$request_uri;
        }
    }
}
