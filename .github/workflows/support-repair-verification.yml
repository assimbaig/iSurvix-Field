name: Isolated support repair verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/support_repair.py'
      - 'scripts/support_repair_rehearsal.py'
      - 'backend/core/test_support_repair_operator.py'
      - 'tests/fixtures/support_repair/**'
      - '.github/workflows/support-repair-verification.yml'
  push:
    branches: ['support/repair-*']
permissions:
  contents: read
concurrency:
  group: support-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-container-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare a previously reviewed immutable Python image
        env:
          PYTHON_IMAGE: python@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
        run: |
          docker pull "$PYTHON_IMAGE"
          image="$(docker image inspect --format '{{.Id}}' "$PYTHON_IMAGE")"
          printf 'REPAIR_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Reproduce, repair and test inside the actual offline container
        env:
          PUBLISHED_FIXTURE: ${{ startsWith(github.ref, 'refs/heads/support/repair-') || startsWith(github.head_ref, 'support/repair-') }}
        run: |
          arguments=()
          if [ "$PUBLISHED_FIXTURE" = 'true' ]; then arguments+=(--published-fixture); fi
          python scripts/support_repair_rehearsal.py --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/support-repair" --image "$REPAIR_IMAGE" "${arguments[@]}"
      - name: Retain safe evidence; no source archives, credentials or operational data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-support-repair-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/support-repair/verification.json
            ${{ runner.temp }}/support-repair/rehearsal.json
            ${{ runner.temp }}/support-repair/diagnostics.zip
            ${{ runner.temp }}/support-repair/prepared/plan.json
            ${{ runner.temp }}/support-repair/prepared/execution.json
            ${{ runner.temp }}/support-repair/prepared/repair-receipt.json
