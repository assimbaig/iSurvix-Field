name: Application verification

on:
  pull_request:
  push:
    branches: [main, feat/secure-outbound-survey-workers, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install reviewed package installer
        run: python -m pip install -r deploy/requirements.bootstrap.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - name: Isolated unit and HTTP integration tests
        run: python scripts/run_backend_tests.py --verbosity 1
      - name: Corporate website source and compact login checks
        run: python -m unittest discover -s website/corporate/tests -p "test_*.py" -v
      - name: Check migration drift
        run: python backend/manage.py makemigrations --check --dry-run --settings=checklist.settings_local

  frontend:
    name: Frontend / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser-test dependency
        working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Unit checks and responsive browser geometry
        working-directory: frontend
        run: npm test
