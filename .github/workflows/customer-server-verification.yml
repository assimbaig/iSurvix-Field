name: Disposable customer server package
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: customer-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  disposable-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ISURVIX_DISPOSABLE_REHEARSAL: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the currently deployed baseline for live-branch PRs
        id: channel
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat/ai-settings-routing-20261031'
        run: |
          git fetch origin deployments/hostinger-beta
          git show FETCH_HEAD:channel.json > "$RUNNER_TEMP/hostinger-channel.json"
          python deploy/hostinger/channel.py baseline --record "$RUNNER_TEMP/hostinger-channel.json" --github-output "$GITHUB_OUTPUT"
      - name: Build, transfer, offline load and private LAN install rehearsal
        shell: bash
        env:
          ISURVIX_UPGRADE_BASELINE: ${{ steps.channel.outputs.source_commit }}
          ISURVIX_UPGRADE_SOURCE_SCHEMA: ${{ steps.channel.outputs.source_schema }}
        run: bash deploy/verify_customer.sh "$RUNNER_TEMP/isurvix-customer" "$GITHUB_WORKSPACE"
      - name: Rehearse actual Hostinger controller with isolated Docker and retained evidence
        shell: bash
        run: |
          baseline="$(python -c 'import json,os;from pathlib import Path;print(json.loads((Path(os.environ["RUNNER_TEMP"])/"isurvix-customer/update-rehearsal/versions.json").read_text())["baseline"])')"
          sudo env ISURVIX_DISPOSABLE_REHEARSAL=yes GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" \
            /usr/bin/python3 deploy/hostinger/verify_delivery.py \
            --work "$RUNNER_TEMP/hostinger-delivery-rehearsal" \
            --source-package "$RUNNER_TEMP/isurvix-customer/update-rehearsal/source-package" \
            --target-package "$RUNNER_TEMP/isurvix-customer/package" \
            --source-release "$baseline" --target-release "$(git rev-parse HEAD)"
      - name: Retain review evidence without keys, credentials or databases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-server-verification
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/isurvix-customer/verification.json
            ${{ runner.temp }}/isurvix-customer/lan-client.json
            ${{ runner.temp }}/isurvix-customer/package/manifest.json
            ${{ runner.temp }}/isurvix-customer/package/metadata/
            ${{ runner.temp }}/isurvix-customer/package-build.json
            ${{ runner.temp }}/isurvix-customer/build.log
            ${{ runner.temp }}/isurvix-customer/compose.log
            ${{ runner.temp }}/isurvix-customer/readiness-probe.log
            ${{ runner.temp }}/isurvix-customer/image-user-readable.json
            ${{ runner.temp }}/isurvix-customer/host-listener-ready.json
            ${{ runner.temp }}/isurvix-customer/update-rehearsal/upgrade-verification.json
            ${{ runner.temp }}/isurvix-customer/update-rehearsal/build.log
            ${{ runner.temp }}/isurvix-customer/update-rehearsal/source-compose.log
            ${{ runner.temp }}/isurvix-customer/update-rehearsal/caught-result.json
            ${{ runner.temp }}/isurvix-customer/update-rehearsal/recovery-result.json
            ${{ runner.temp }}/isurvix-customer/update-rehearsal/success-result.json
            ${{ runner.temp }}/hostinger-delivery-rehearsal/verification.json
            ${{ runner.temp }}/hostinger-delivery-rehearsal/compose.log
      - name: Retain unapproved transferable candidate for owner review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: customer-server-DRAFT-candidate
          include-hidden-files: true
          retention-days: 7
          path: ${{ runner.temp }}/isurvix-customer/package/
