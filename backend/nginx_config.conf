# Initial HTTP-only configuration
# Certbot will automatically add HTTPS and redirect when you run it

server {
    listen 80;
    server_name isurvix.com www.isurvix.com 161.97.122.19;

    client_max_body_size 120M;

    # Static files - UPDATE THIS PATH for your server
    location /static/ {
        alias /root/isurvix/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ALL uploads and generated outputs are private, including future folders.
    # Django's authenticated, project-scoped views stream authorised files.
    # Never alias MEDIA_ROOT here: an unpredictable filename is not permission.
    location = /media { return 404; }
    location ^~ /media/ { return 404; }

    # Let's Encrypt ACME challenge - MUST come before location /
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Django application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Logs
    access_log /var/log/nginx/checklist_access.log;
    error_log /var/log/nginx/checklist_error.log;
}
